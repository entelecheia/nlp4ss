---
name: semantic-release

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths: ["src/**", "pyproject.toml"]

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  # Reuse CI instead of rebuilding: a successful `lint & test` run for this exact
  # commit (fast-forward `release` to a verified main commit) skips validation.
  verified:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lint_and_test.yaml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count || echo 0)
          echo "found=$([ "$n" != "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "successful 'lint & test' runs for $GITHUB_SHA: $n" | tee -a "$GITHUB_STEP_SUMMARY"

  validate:
    needs: verified
    if: needs.verified.outputs.found != 'true'
    uses: ./.github/workflows/lint_and_test.yaml
    permissions:
      contents: read
      actions: read
      pull-requests: read

  release:
    needs: [verified, validate]
    if: always() && (needs.verified.outputs.found == 'true' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # PyPI trusted publishing
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Pin the release branch to the workflow sha
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: git checkout -B "$RELEASE_BRANCH" "$RELEASE_SHA"
      - name: Semantic version release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          build: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.release.outputs.released == 'true'
      - name: Upload GitHub release assets
        uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
