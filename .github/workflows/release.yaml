---
name: semantic-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Republish a tag this workflow created (e.g. v1.2.3) after a failed upload; older tags fail validation and are not published. Empty runs a normal release"
        required: false
        default: ""
  push:
    branches: [release]
    paths: ["src/**", "pyproject.toml"]

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  # Reuse CI instead of rebuilding: a successful `lint & test` run for this exact
  # commit (fast-forward `release` to a verified main commit) skips validation.
  verified:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lint_and_test.yaml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count || echo 0)
          echo "found=$([ "$n" != "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "successful 'lint & test' runs for $GITHUB_SHA: $n" | tee -a "$GITHUB_STEP_SUMMARY"

  validate:
    needs: verified
    # A tag republish skips `verified` and always validates the tag itself.
    if: always() && needs.verified.outputs.found != 'true'
    uses: ./.github/workflows/lint_and_test.yaml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read

  release:
    needs: [verified, validate]
    if: always() && (needs.verified.outputs.found == 'true' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # PyPI trusted publishing
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - name: Pin the release branch to the workflow sha
        if: inputs.tag == ''
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: git checkout -B "$RELEASE_BRANCH" "$RELEASE_SHA"
      - name: Semantic version release
        if: inputs.tag == ''
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          build: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
      - name: Build the tag being republished
        if: inputs.tag != ''
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
      - if: inputs.tag != ''
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.release.outputs.released == 'true' || inputs.tag != ''
        with:
          skip-existing: true # a retry may find some files already uploaded
      - name: Upload GitHub release assets
        uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: steps.release.outputs.released == 'true' || inputs.tag != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || steps.release.outputs.tag }}
