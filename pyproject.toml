[project]
name = "nlp4ss"
version = "0.9.0"
description = "A course on applying natural language processing (NLP) techniques for social science research."
authors = [{ name = "Young Joon Lee", email = "entelecheia@hotmail.com" }]
license = "CC-BY-4.0"
readme = "README.md"
# The upper bound follows the pinned course stack (scipy<1.14, gensim, torch<=2.7).
requires-python = ">=3.11,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.3,<9",
    "pyyaml>=6.0.1,<7",
    "nltk<=3.10.3",
    "scikit-learn>=1.5.1,<2",
    "spacy>=3.7.5,<=3.8.5",
    "textblob>=0.18,<0.20",
    "openai>=1.35.14,<2",
    "seaborn>=0.13.2,<0.14",
    "gensim>=4.3.3,<5",
    "pyldavis>=3.4.1,<4",
    "wordcloud>=1.9.3,<2",
    "scipy>=1.7.0,<1.14.0",
    "transformers==4.50.2",
    "torch>=2.3.1,<=2.14.1",
    "sentence-transformers>=3.0.1,<5.0.0",
    "tqdm>=4.66.5,<5",
]

[project.urls]
Homepage = "https://nlp4ss.jeju.ai"
Repository = "https://github.com/entelecheia/nlp4ss"
Changelog = "https://github.com/entelecheia/nlp4ss/blob/main/CHANGELOG.md"

[project.scripts]
nlp4ss = "nlp4ss.__cli__:main"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.15"]
# pip: the notebooks run `%pip install` and `python -m spacy download`, which need it in the kernel env.
notebook = ["pip"]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "notebook" }]

[tool.uv]
default-groups = ["dev"]
# Lock-only floor: preferring smart-open 8 (via gensim) otherwise backtracks weasel to 0.1 and
# typer to 0.7, which breaks the spaCy CLI on click 8.2+.
constraint-dependencies = ["typer>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlp4ss"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["book", ".github/scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["nlp4ss"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = ["pragma: no cover", 'if __name__ == "__main__":']

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = true
version_source = "tag"
commit_message = ":rocket: {version}\n\nAutomatically generated by python-semantic-release"
build_command = "pip install uv==0.13.1 && uv lock --upgrade-package \"$PACKAGE_NAME\" && git add uv.lock && uv build"
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "src/nlp4ss/_version.py:__version__",
    ".docker/docker.version:IMAGE_VERSION",
]

[tool.semantic_release.branches.main]
match = "release"
prerelease = false

[tool.semantic_release.changelog]
insertion_flag = "<!--next-version-placeholder-->"
mode = "update"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
